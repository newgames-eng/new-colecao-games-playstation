<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW COLEÇÃO GAMES PLAYSTATION</title>
<style>
:root{
  --bg:#020817;--panel:#071426;--panel2:#0a1930;--line:#18365f;
  --blue:#0868ff;--blue2:#00a3ff;--text:#f5f8ff;--muted:#8da3c5;
  --green:#00e676;--yellow:#ffc107;--red:#ff3158;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:
radial-gradient(circle at 75% -10%,rgba(0,110,255,.25),transparent 30%),
linear-gradient(180deg,#020817,#030a15 70%);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:245px;padding:22px 15px;background:
linear-gradient(180deg,#041534,#020b1c);border-right:1px solid #0754c9;
box-shadow:8px 0 35px rgba(0,80,255,.08);z-index:20;overflow:auto}
.brand{text-align:center;padding:8px 5px 24px;border-bottom:1px solid rgba(50,100,170,.25)}
.psmark{font-size:42px;font-weight:bold;line-height:1}
.brand h1{font-size:17px;margin:12px 0 4px}
.brand b{color:#0b91ff;font-size:13px}
.nav{padding-top:18px}
.nav-title{font-size:10px;color:#0b8cff;text-transform:uppercase;margin:18px 10px 8px;font-weight:bold}
.nav button{width:100%;border:0;background:transparent;color:#dce7fa;text-align:left;padding:10px 11px;
border-radius:7px;margin:2px 0;font-size:13px}
.nav button:hover,.nav button.active{background:linear-gradient(90deg,#064fc7,#073991);color:white}
.nav .count{float:right;color:#18a1ff}
.add{width:100%;margin-top:22px;border:1px solid #1687ff;border-radius:7px;padding:12px;
background:linear-gradient(135deg,#0877ff,#0647b9);color:white;font-weight:bold}
.main{margin-left:245px;width:calc(100% - 245px);padding:28px 38px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.title{font-size:26px;font-weight:bold}.subtitle{color:var(--muted);margin-top:5px;font-size:13px}
.account{display:flex;align-items:center;gap:12px;color:#c7d6ed;font-size:13px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#0649aa;border:1px solid #1687ff;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.stat{background:linear-gradient(145deg,rgba(10,30,57,.96),rgba(5,18,35,.96));border:1px solid var(--line);
border-radius:8px;padding:13px 15px;display:flex;gap:12px;align-items:center}
.stat-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#092f68;font-size:20px}
.stat strong{display:block;font-size:23px}.stat span{font-size:11px;color:var(--muted)}
.tools{display:flex;gap:10px;margin-bottom:12px}
.search{flex:1;position:relative}.search input{width:100%;padding:13px 16px 13px 42px;border-radius:7px;border:1px solid var(--line);
background:#061226;color:white;outline:none}.search input:focus{border-color:#1687ff}.search .glass{position:absolute;left:15px;top:11px;font-size:19px;color:#88a4cc}
select{background:#061226;color:white;border:1px solid var(--line);border-radius:7px;padding:0 14px;min-width:180px}
.filters{display:flex;gap:7px;overflow:auto;padding-bottom:10px;margin-bottom:10px}
.filters button{white-space:nowrap;background:#061226;color:#b9c9e6;border:1px solid var(--line);padding:8px 13px;border-radius:6px;font-size:12px}
.filters button.active,.filters button:hover{background:#075bd8;color:white;border-color:#1687ff}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:7px 0 12px}
.section-head h2{font-size:18px;margin:0}.result{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:13px}
.card{background:linear-gradient(180deg,#081a34,#041021);border:1px solid #17365e;border-radius:7px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#167cff;box-shadow:0 12px 25px rgba(0,75,255,.18)}
.cover{height:235px;background:linear-gradient(145deg,#0b254b,#020813);position:relative;display:flex;align-items:center;justify-content:center}
.cover img{width:100%;height:100%;object-fit:cover;display:none}
.cover.ready img{display:block}
.cover-placeholder{text-align:center;padding:10px;color:#6d8bb7}
.cover-placeholder .big{font-size:45px;display:block;margin-bottom:8px}
.platform{position:absolute;top:0;left:0;right:0;background:linear-gradient(180deg,#0b7bda,#0758aa);
padding:5px 8px;font-size:11px;font-weight:bold;z-index:2}
.card-body{padding:9px}
.category{font-size:9px;color:#2f9aff;text-transform:uppercase;font-weight:bold}
.card h3{font-size:13px;line-height:1.25;margin:5px 0 3px;min-height:32px}
.meta{font-size:10px;color:#7187a8}
.stars{margin-top:7px;display:flex;align-items:center;justify-content:space-between}
.star{border:0;background:none;padding:0 1px;color:#4a6387;font-size:14px}.star.on{color:#0877ff}
.rating{font-size:10px;color:#a4b7d6}
.status-row{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.status{font-size:8px;padding:4px 6px;border-radius:4px;font-weight:bold}
.played{color:#00e676;background:rgba(0,230,118,.1);border:1px solid #087f4d}
.notplayed{color:#ffc107;background:rgba(255,193,7,.08);border:1px solid #775d13}
.fav{border:0;background:none;color:#8094b4;font-size:18px}.fav.on{color:var(--red)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
.actions button{border:1px solid #1c3b65;background:#07162b;color:#9db2d2;border-radius:4px;padding:5px 3px;font-size:9px}
.actions button:hover{border-color:#1687ff;color:#fff}
.empty{grid-column:1/-1;padding:60px;text-align:center;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.mobile{display:none}
.modal{display:none;position:fixed;inset:0;background:rgba(0,5,15,.88);z-index:100;padding:20px;overflow:auto}
.modal-box{max-width:520px;margin:30px auto;background:#07172d;border:1px solid #1760b7;border-radius:10px;padding:22px}
.modal-box h2{margin:0 0 16px}.form label{display:block;font-size:11px;color:#a9bddb;margin:11px 0 5px}
.form input,.form select{width:100%;height:40px;padding:0 10px;min-width:0}
.modal-buttons{display:flex;gap:8px;margin-top:20px}.modal-buttons button{flex:1;padding:10px;border:0;border-radius:6px}
.save{background:#0877ff;color:white}.cancel{background:#26364e;color:white}
@media(max-width:1250px){.grid{grid-template-columns:repeat(5,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}.sidebar{width:210px}.main{margin-left:210px;width:calc(100% - 210px);padding:22px}}
@media(max-width:760px){
.sidebar{display:none}.main{margin-left:0;width:100%;padding:18px 12px 78px}
.top{margin-bottom:16px}.title{font-size:22px}.account span{display:none}
.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:10px}.stat strong{font-size:20px}.stat-icon{width:37px;height:37px}
.tools{flex-direction:column}.tools select{height:42px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.cover{height:210px}
.mobile{display:flex;position:fixed;left:0;right:0;bottom:0;height:60px;background:#06152b;border-top:1px solid #164b8c;z-index:50;justify-content:space-around}
.mobile button{background:none;border:0;color:#a7bad6;font-size:9px}.mobile span{display:block;font-size:19px;margin-bottom:2px}
}
</style>
</head>
<body>

<div class="app">
<aside class="sidebar">
  <div class="brand">
    <div class="psmark">PS</div>
    <h1>NEW COLEÇÃO</h1>
    <b>GAMES PLAYSTATION</b>
  </div>
  <div class="nav" id="nav"></div>
  <button class="add" onclick="openModal()">＋ Cadastrar Jogo</button>
</aside>

<main class="main">
  <div class="top">
    <div>
      <div class="title">Olá, jogador! 🎮</div>
      <div class="subtitle">Bem-vindo à sua coleção PlayStation</div>
    </div>
    <div class="account"><div class="avatar">NG</div><span>Minha Conta⌄</span></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-icon">🎮</div><div><strong id="stTotal">0</strong><span>Total de Jogos</span></div></div>
    <div class="stat"><div class="stat-icon">✓</div><div><strong id="stPlayed">0</strong><span>Jogados</span></div></div>
    <div class="stat"><div class="stat-icon">◷</div><div><strong id="stNot">0</strong><span>Não Jogados</span></div></div>
    <div class="stat"><div class="stat-icon">☆</div><div><strong id="stAvg">0.0</strong><span>Média de Avaliações</span></div></div>
    <div class="stat"><div class="stat-icon">♡</div><div><strong id="stFav">0</strong><span>Favoritos</span></div></div>
  </div>

  <div class="tools">
    <div class="search"><span class="glass">⌕</span><input id="search" placeholder="Pesquisar jogo..."></div>
    <select id="sort"><option value="recent">Mais Recentes</option><option value="name">Nome A-Z</option><option value="rating">Melhor Avaliados</option><option value="category">Categoria</option></select>
  </div>

  <div class="filters" id="filters"></div>

  <div class="section-head"><h2>🎮 Minha Coleção</h2><div class="result" id="result"></div></div>
  <div class="grid" id="grid"></div>
</main>
</div>

<div class="mobile">
  <button onclick="setFilter('')"><span>⌂</span>Início</button>
  <button onclick="setFilter('')"><span>🎮</span>Jogos</button>
  <button onclick="setSpecial('rated')"><span>☆</span>Avaliados</button>
  <button onclick="setSpecial('fav')"><span>♡</span>Favoritos</button>
  <button onclick="openModal()"><span>＋</span>Adicionar</button>
</div>

<div class="modal" id="modal">
 <div class="modal-box">
  <h2 id="modalTitle">＋ Cadastrar Jogo</h2>
  <form class="form" id="form">
   <label>Nome do jogo</label><input id="fName" required>
   <label>Categoria</label><select id="fCat" required></select>
   <label>Plataforma</label><select id="fPlatform"><option>PS4</option><option>PS5</option><option>PS4 / PS5</option></select>
   <label>Ano</label><input id="fYear" type="number">
   <label>Capa</label><input id="fCover" type="file" accept="image/*">
   <div class="modal-buttons"><button type="button" class="cancel" onclick="closeModal()">Cancelar</button><button class="save">Salvar Jogo</button></div>
  </form>
 </div>
</div>

    b.onclick=()=>setFilter(c,b);
    nav.appendChild(b);
  });
}

function renderFilters(){
  const box=document.getElementById("filters");box.innerHTML="";
  const make=(label,value)=>{const b=document.createElement("button");b.textContent=label;b.className=filter===value&&!special?"active":"";b.onclick=()=>setFilter(value,b);box.appendChild(b)};
  make("Todos","");
  CATEGORIES.slice(0,8).forEach(c=>make((ICONS[c]||"")+" "+c.replace(" / Survival Horror","").replace(" / Velocidade",""),c));
  const more=document.createElement("button");more.textContent="Mais ▾";more.onclick=()=>{filter="";special="";render()};box.appendChild(more);
}

function render(){
  renderNav();renderFilters();
  const q=document.getElementById("search").value.toLowerCase().trim();
  let list=games.filter(g=>{
    const d=info(g.nome);
    let ok=(g.nome+" "+g.categoria).toLowerCase().includes(q);
    if(filter) ok=ok&&g.categoria===filter;
    if(special==="fav") ok=ok&&d.fav;
    if(special==="played") ok=ok&&d.played;
    if(special==="not") ok=ok&&!d.played;
    if(special==="rated") ok=ok&&d.rating>0;
    return ok;
  });
  const sort=document.getElementById("sort").value;
  if(sort==="name") list.sort((a,b)=>a.nome.localeCompare(b.nome));
  if(sort==="category") list.sort((a,b)=>a.categoria.localeCompare(b.categoria)||a.nome.localeCompare(b.nome));
  if(sort==="rating") list.sort((a,b)=>info(b.nome).rating-info(a.nome).rating);
  document.getElementById("result").textContent=list.length+" jogo(s)";
  const grid=document.getElementById("grid");grid.innerHTML="";
  if(!list.length){grid.innerHTML="<div class='empty'><h2>🎮 Nenhum jogo encontrado</h2><p>Tente outra pesquisa ou categoria.</p></div>";}
  list.forEach(g=>{
    const d=info(g.nome), card=document.createElement("div");card.className="card";
    let stars="";for(let i=1;i<=5;i++)stars+=`<button class="star ${i<=d.rating?'on':''}" onclick="rate('${esc(g.nome)}',${i})">★</button>`;
    card.innerHTML=`
      <div class="cover ${g.capa?'ready':''}">
        <div class="platform">◉ ${g.plataforma||"PS4"}</div>
        ${g.capa?`<img src="${g.capa}" alt="${esc(g.nome)}">`:"<div class='cover-placeholder'><span class='big'>"+(ICONS[g.categoria]||"🎮")+"</span>CAPA DO JOGO</div>"}
      </div>
      <div class="card-body">
        <div class="category">${g.categoria}</div>
        <h3>${g.nome}</h3>
        <div class="meta">${g.ano||"Ano não informado"}</div>
        <div class="stars"><div>${stars}</div><span class="rating">${d.rating?d.rating+".0":"-"}</span></div>
        <div class="status-row"><span class="status ${d.played?'played':'notplayed'}">${d.played?'✓ JOGADO':'◷ NÃO JOGADO'}</span>
        <button class="fav ${d.fav?'on':''}" onclick="favorite('${esc(g.nome)}')">${d.fav?'♥':'♡'}</button></div>
        <div class="actions">
          <button onclick="togglePlayed('${esc(g.nome)}')">${d.played?'↩ Desmarcar':'✓ Jogado'}</button>
          <button onclick="editGame('${esc(g.nome)}')">✏ Editar</button>
          <button onclick="viewGame('${esc(g.nome)}')">👁 Ver</button>
          <button onclick="deleteGame('${esc(g.nome)}')">🗑 Excluir</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });
  updateStats();save();
}

function updateStats(){
 let played=0,fav=0,sum=0,n=0;
 games.forEach(g=>{const d=info(g.nome);if(d.played)played++;if(d.fav)fav++;if(d.rating){sum+=d.rating;n++;}});
 document.getElementById("stTotal").textContent=games.length;
 document.getElementById("stPlayed").textContent=played;
 document.getElementById("stNot").textContent=games.length-played;
 document.getElementById("stAvg").textContent=n?(sum/n).toFixed(1):"0.0";
 document.getElementById("stFav").textContent=fav;
}
function setFilter(c){filter=c;special="";render()}
function setSpecial(s){special=s;filter="";render()}
function rate(n,r){info(n).rating=r;render()}
function favorite(n){info(n).fav=!info(n).fav;render()}
function togglePlayed(n){info(n).played=!info(n).played;render()}
function viewGame(n){const g=games.find(x=>x.nome===n),d=info(n);alert("🎮 "+g.nome+"\\n\\nCategoria: "+g.categoria+"\\nPlataforma: "+g.plataforma+"\\nAvaliação: "+(d.rating?("★".repeat(d.rating)): "Sem avaliação")+"\\nStatus: "+(d.played?"Jogado":"Não jogado"))}
function deleteGame(n){if(!confirm("Excluir "+n+" da coleção?"))return;games=games.filter(g=>g.nome!==n);delete state[n];render()}

function fillCats(selected=""){
 const s=document.getElementById("fCat");s.innerHTML="<option value=''>Selecione</option>";
 CATEGORIES.forEach(c=>s.innerHTML+=`<option value="${c}" ${c===selected?"selected":""}>${ICONS[c]||"🎮"} ${c}</option>`);
}
function openModal(name=null){
 editing=name;
 document.getElementById("modalTitle").textContent=name?"✏ Editar Jogo":"＋ Cadastrar Jogo";
 fillCats(name?games.find(g=>g.nome===name).categoria:"");
 document.getElementById("fName").value=name?games.find(g=>g.nome===name).nome:"";
 document.getElementById("fPlatform").value=name?games.find(g=>g.nome===name).plataforma:"PS4";
 document.getElementById("fYear").value=name?games.find(g=>g.nome===name).ano:"";
 document.getElementById("fCover").value="";
 document.getElementById("modal").style.display="block";
}
function closeModal(){document.getElementById("modal").style.display="none"}
function editGame(n){openModal(n)}

document.getElementById("form").addEventListener("submit",e=>{
 e.preventDefault();
 const nome=document.getElementById("fName").value.trim(),cat=document.getElementById("fCat").value;
 const platform=document.getElementById("fPlatform").value,year=document.getElementById("fYear").value;
 const file=document.getElementById("fCover").files[0];
 if(!nome||!cat)return;
 if(editing){
   const g=games.find(x=>x.nome===editing),old=g.nome;
   g.nome=nome;g.categoria=cat;g.plataforma=platform;g.ano=year;
   if(old!==nome){state[nome]=state[old]||{rating:0,played:false,fav:false};delete state[old]}
   if(file){const r=new FileReader();r.onload=ev=>{g.capa=ev.target.result;closeModal();render()};r.readAsDataURL(file)}
   else{closeModal();render()}
 }else{
   if(games.some(g=>g.nome.toLowerCase()===nome.toLowerCase())){alert("Esse jogo já está cadastrado.");return}
   const add=g=>{games.push({id:Date.now(),nome,categoria:cat,plataforma:platform,ano:year,capa:g||""});closeModal();render()};
   if(file){const r=new FileReader();r.onload=ev=>add(ev.target.result);r.readAsDataURL(file)}else add("");
 }
});
document.getElementById("search").addEventListener("input",render);
document.getElementById("sort").addEventListener("change",render);
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
fillCats();render();
</script>
</body>
</html>
