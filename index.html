[["🏠","Início",""],["🎮","Minha Coleção",""],["📊","Dashboard","dash"],["☆","Avaliados","rated"],["✓","Jogados","played"],["◷","Não Jogados","not"],["♡","Favoritos","fav"],["❤️","Lista de Desejos","wish"]].forEach(x=>{let b=document.createElement("button");b.innerHTML=x[0]+" &nbsp; "+x[1];b.className=(!filter&&!special&&x[1]=="Início")||special==x[2]?"active":"";b.onclick=()=>x[2]=="dash"?showDashboard():x[2]?setSpecial(x[2]):setFilter("");n.appendChild(b)});
let t=document.createElement("div");t.className="nav-title";t.textContent="Categorias";n.appendChild(t);
CATS.forEach(c=>{let b=document.createElement("button");b.className=filter==c?"active":"";b.innerHTML=(ICON[c]||"🎮")+" &nbsp; "+c+" <span class='count'>"+games.filter(g=>g.categoria==c).length+"</span>";b.onclick=()=>setFilter(c);n.appendChild(b)})}

function filters(){let x=document.getElementById("filters");x.innerHTML="";let add=(t,v)=>{let b=document.createElement("button");b.textContent=t;b.className=filter==v&&!special?"active":"";b.onclick=()=>setFilter(v);x.appendChild(b)};add("Todos","");CATS.slice(0,10).forEach(c=>add((ICON[c]||"🎮")+" "+c.replace(" / Survival Horror","").replace(" / Velocidade",""),c))}
function render(){if(document.getElementById("dashboard").classList.contains("show"))return;nav();filters();let q=document.getElementById("search").value.toLowerCase().trim();
let list=games.filter(g=>{let z=d(g.nome),txt=(g.nome+" "+g.categoria+" "+(g.tags||[]).join(" ")+" "+g.plataforma+" "+g.midia).toLowerCase(),ok=txt.includes(q);if(filter)ok=ok&&g.categoria==filter;if(special=="fav")ok=ok&&z.fav;if(special=="played")ok=ok&&z.played;if(special=="not")ok=ok&&!z.played;if(special=="rated")ok=ok&&z.rating>0;if(special=="wish")ok=ok&&g.wishlist;return ok});
let s=document.getElementById("sort").value;if(s=="name")list.sort((a,b)=>a.nome.localeCompare(b.nome));if(s=="category")list.sort((a,b)=>a.categoria.localeCompare(b.categoria));if(s=="rating")list.sort((a,b)=>d(b.nome).rating-d(a.nome).rating);
document.getElementById("result").textContent=list.length+" jogo(s)";document.getElementById("section").textContent=special=="wish"?"❤️ Lista de Desejos":filter?(ICON[filter]||"🎮")+" "+filter:"🎮 Minha Coleção";
let box=document.getElementById("grid");box.className="grid"+(listMode?" list":"");box.innerHTML="";
if(!list.length){box.innerHTML="<div class='empty'><h2>🎮 Nenhum jogo encontrado</h2><p>Cadastre um jogo ou altere os filtros.</p></div>";updateStats();return}
list.forEach(g=>{let z=d(g.nome),stars="";for(let i=1;i<=5;i++)stars+=`<button class="star ${{i<=z.rating?"on":""}}" onclick="rate('${safe(g.nome)}',${i})">★</button>`;
let ts=(g.tags||[]).slice(0,3).map(t=>`<span class="tag">${safe(t)}</span>`).join(""),ph=ICON[g.categoria]||"🎮";
let c=document.createElement("div");c.className="card";c.innerHTML=`<div class="cover"><div class="platform">◉ ${{g.plataforma||"PS4"}}</div>${{g.capa?`<img src="${g.capa}" alt="">`:`<div class="ph"><b>${ph}</b>CAPA NÃO CADASTRADA</div>`}}</div><div class="body"><div class="cat">${g.categoria}</div><h3>${safe(g.nome)}</h3><div class="meta">${g.ano||"Ano não informado"} • ${g.midia||"Física"}</div><div class="stars"><div>${stars}</div><span class="rate">${z.rating?z.rating+".0":"-"}</span></div><div class="statusrow"><span class="status ${{z.played?"played":"notplayed"}}">${{z.played?"✓ JOGADO":"◷ NÃO JOGADO"}}</span><button class="fav ${{z.fav?"on":""}}" onclick="fav('${safe(g.nome)}')">${{z.fav?"♥":"♡"}}</button></div>${{ts?`<div class="tags">${ts}</div>`:""}}<div class="actions"><button onclick="played('${safe(g.nome)}')">${{z.played?"↩ Desmarcar":"✓ Jogado"}}</button><button onclick="editGame('${safe(g.nome)}')">✏ Editar</button><button onclick="view('${safe(g.nome)}')">👁 Ver</button><button onclick="del('${safe(g.nome)}')">🗑 Excluir</button></div></div>`;box.appendChild(c)});
updateStats();save()}
function updateStats(){let p=0,f=0,sum=0,n=0;games.forEach(g=>{let z=d(g.nome);if(z.played)p++;if(z.fav)f++;if(z.rating){sum+=z.rating;n++}});sTotal.textContent=games.length;sPlayed.textContent=p;sNot.textContent=games.length-p;sFav.textContent=f;sAvg.textContent=n?(sum/n).toFixed(1):"0.0"}
function setFilter(v){filter=v;special="";render()}function setSpecial(v){special=v;filter="";render()}function rate(n,r){d(n).rating=r;render();toast("Avaliação salva")}function fav(n){d(n).fav=!d(n).fav;render()}function played(n){d(n).played=!d(n).played;render()}
function showCollection(){document.getElementById("collection").style.display="block";document.getElementById("dashboard").classList.remove("show");render()}
function bars(obj,total){return Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="bar"><small><span>${x[0]}</span><b>${x[1]}</b></small><div class="track"><div class="fill" style="width:${Math.max(3,x[1]/total*100)}%"></div></div></div>`).join("")}
function showDashboard(){document.getElementById("collection").style.display="none";document.getElementById("dashboard").classList.add("show");let cc={},pc={},p=0;games.forEach(g=>{cc[g.categoria]=(cc[g.categoria]||0)+1;pc[g.plataforma||"PS4"]=(pc[g.plataforma||"PS4"]||0)+1;if(d(g.nome).played)p++});catChart.innerHTML=bars(cc,games.length);platChart.innerHTML=bars(pc,games.length);statusChart.innerHTML=bars({Jogados:p,"Não jogados":games.length-p,Favoritos:games.filter(g=>d(g.nome).fav).length,Avaliados:games.filter(g=>d(g.nome).rating).length},games.length);summary.innerHTML="<b>Total:</b> "+games.length+"<br><b>Jogados:</b> "+p+"<br><b>Não jogados:</b> "+(games.length-p)+"<br><b>Favoritos:</b> "+games.filter(g=>d(g.nome).fav).length+"<br><b>Com capa:</b> "+games.filter(g=>g.capa).length+"<br><br>Use tags para localizar jogos por tema, franquia ou característica."}
function openModal(name=null){editing=name;tags=name?[...(games.find(g=>g.nome==name).tags||[])]:[];document.getElementById("modalTitle").textContent=name?"✏ Editar Jogo":"＋ Cadastrar Jogo";document.getElementById("form").reset();let g=name?games.find(x=>x.nome==name):null;document.getElementById("fCat").innerHTML="<option value=''>Selecione</option>"+CATS.map(c=>`<option>${c}</option>`).join("");if(g){fName.value=g.nome;fCat.value=g.categoria;fPlatform.value=g.plataforma||"PS4";fYear.value=g.ano||"";fMedia.value=g.midia||"Física";fPrice.value=g.preco||"";fDate.value=g.data||"";fCondition.value=g.estado||"Novo";fDesc.value=g.descricao||""}renderTags();modal.style.display="block"}
function closeModal(){modal.style.display="none"}function addTag(){let v=fTag.value.trim();if(v&&!tags.includes(v))tags.push(v);fTag.value="";renderTags()}function renderTags(){chosen.innerHTML=tags.map((t,i)=>`<span>${safe(t)} <button type="button" onclick="tags.splice(${i},1);renderTags()">×</button></span>`).join("")}
form.addEventListener("submit",e=>{e.preventDefault();let n=fName.value.trim(),c=fCat.value;if(!n||!c)return;let file=fCover.files[0];let finish=cover=>{if(editing){let g=games.find(x=>x.nome==editing),old=g.nome;Object.assign(g,{nome:n,categoria:c,plataforma:fPlatform.value,ano:fYear.value,midia:fMedia.value,preco:fPrice.value,data:fDate.value,estado:fCondition.value,descricao:fDesc.value,tags:[...tags]});if(cover!==null)g.capa=cover;if(old!=n){state[n]=state[old]||{rating:0,played:false,fav:false};delete state[old]}}else{if(games.some(x=>x.nome.toLowerCase()==n.toLowerCase())){alert("Esse jogo já está cadastrado.");return}games.push({id:Date.now(),nome:n,categoria:c,plataforma:fPlatform.value,ano:fYear.value,midia:fMedia.value,preco:fPrice.value,data:fDate.value,estado:fCondition.value,descricao:fDesc.value,tags:[...tags],capa:cover||"",wishlist:false});state[n]={rating:0,played:false,fav:false}}save();closeModal();render();toast(editing?"Jogo atualizado":"Jogo cadastrado")};if(file){let r=new FileReader();r.onload=e=>finish(e.target.result);r.readAsDataURL(file)}else finish(editing?games.find(g=>g.nome==editing).capa:null)})
function editGame(n){openModal(n)}function del(n){if(confirm("Excluir "+n+" da coleção?")){games=games.filter(g=>g.nome!=n);delete state[n];save();render();toast("Jogo excluído")}}function view(n){let g=games.find(x=>x.nome==n),z=d(n);alert("🎮 "+g.nome+"\\n\\nCategoria: "+g.categoria+"\\nPlataforma: "+g.plataforma+"\\nMídia: "+g.midia+"\\nAno: "+(g.ano||"Não informado")+"\\nAvaliação: "+(z.rating?"★".repeat(z.rating)+"☆".repeat(5-z.rating):"Sem avaliação")+"\\nStatus: "+(z.played?"Jogado":"Não jogado")+"\\nTags: "+((g.tags||[]).join(", ")||"Nenhuma")+"\\n\\n"+(g.descricao||""))}
search.addEventListener("input",render);sort.addEventListener("change",render);gridBtn.onclick=()=>{listMode=false;gridBtn.classList.add("active");listBtn.classList.remove("active");render()};listBtn.onclick=()=>{listMode=true;listBtn.classList.add("active");gridBtn.classList.remove("active");render()};modal.addEventListener("click",e=>{if(e.target==modal)closeModal()});render();
</script>
</body>
</html>
